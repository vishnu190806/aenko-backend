spring.application.name=aenko-backend
server.port=${PORT:8080}

# ---------- Database (MySQL, override with env vars) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aenko?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:dev-secret-key-change-me-please-use-at-least-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- MyAnimeList provider (public metadata via client ID header) ----------
mal.base-url=${MAL_BASE_URL:https://api.myanimelist.net/v2}
mal.client-id=${MAL_CLIENT_ID:}

# ---------- AI (optional, OpenAI-compatible) ----------
ai.enabled=${AI_ENABLED:false}
ai.provider=${AI_PROVIDER:openai}
ai.base-url=${AI_BASE_URL:}
ai.api-key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.model=${AI_MODEL:}

logging.level.com.project.aenko=INFO
